[package]
name = "instatt-rs"
version = "0.1.2"
edition = "2024"
description = "Unofficial Rust client for the UNM Instatt attendance backend."

repository = "https://github.com/Aliorpse/instatt-rs"
license = "MIT"
readme = "README.md"
keywords = ["instatt", "attendance", "unm"]
categories = ["api-bindings"]

[lib]
name = "instatt"
path = "src/lib.rs"

[dependencies]
base64 = "0.23"
chrono = "0.4"
reqwest = { version = "0.13", features = ["json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
